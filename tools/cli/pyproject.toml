[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titvo-local-cli"
version = "0.1.0"
description = "Titvo CLI para fullscan con MiniStack o API AWS"
requires-python = ">=3.13"
dependencies = ["boto3>=1.40.59", "rich>=13", "typer>=0.12", "questionary>=2,<3"]

[project.scripts]
titvo = "titvo_cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["titvo_cli*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
